<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拜訪紀錄管理系統 v2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🐾 傳道紀錄本 v2.0</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchPage('dashboard')">📊 儀表板</button>
      <button class="nav-btn" onclick="switchPage('list')">👥 拜訪總表</button>
      <button class="nav-btn" onclick="switchPage('settings')">⚙️ 系統設定</button>
    </div>
  </nav>

  <main class="container">

    <section id="page-dashboard" class="page-view">
      <div class="page-header">
        <h2>數據儀表板</h2>
        <p id="dashboard-welcome">歡迎回來！</p>
      </div>
      <div class="dashboard-grid">
        <div class="stat-card">
          <h3>總拜訪對象</h3>
          <p id="stat-total">0 人</p>
        </div>
        <div class="stat-card">
          <h3>持續追蹤中</h3>
          <p id="stat-tracking">0 人</p>
        </div>
        <div class="stat-card">
          <h3>新接觸對象</h3>
          <p id="stat-new">0 人</p>
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" onclick="switchPage('list')">一鍵前往總表頁面 →</button>
      </div>
    </section>

    <section id="page-list" class="page-view hidden">
      <div class="page-header">
        <h2>拜訪對象總表</h2>
        <button class="btn-success" onclick="openAddVisitorModal()">＋ 新增拜訪對象</button>
      </div>
      
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="搜尋姓名或地址...">
        <select id="filter-status">
          <option value="">所有狀態</option>
          <option value="新接觸">新接觸</option>
          <option value="持續追蹤">持續追蹤</option>
          <option value="暫時結案">暫時結案</option>
        </select>
        <select id="filter-area">
          <option value="">所有區域</option>
        </select>
      </div>

      <div id="visitor-cards-container" class="cards-grid">
        <p class="loading-text">資料載入中...</p>
      </div>
    </section>

    <section id="page-detail" class="page-view hidden">
      <div class="page-header">
        <button class="btn-secondary" onclick="switchPage('list')">← 返回總表</button>
        <h2>個人追蹤紀錄詳情</h2>
      </div>

      <div class="detail-profile-card">
        <h3 id="detail-name">載入中...</h3>
        <p><strong>電話：</strong><span id="detail-phone">-</span></p>
        <p><strong>地址：</strong><span id="detail-address">-</span></p>
        <p><strong>分類/區域：</strong><span id="detail-meta">-</span></p>
      </div>

      <div class="log-form-box">
        <h3>✏️ 新增本次拜訪紀錄</h3>
        <form id="add-log-form">
          <div class="form-group">
            <label>拜訪日期：</label>
            <input type="date" id="log-date" required>
          </div>
          <div class="form-group">
            <label>管道：</label>
            <select id="log-type">
              <option value="面談">面談</option>
              <option value="電話">電話</option>
              <option value="訊息">訊息</option>
            </select>
          </div>
          <div class="form-group">
            <label>對話紀錄/摘要：</label>
            <textarea id="log-notes" rows="3" placeholder="請輸入本次聊天的重點..." required></textarea>
          </div>
          <div class="form-group">
            <label>下次跟進事宜：</label>
            <input type="text" id="log-next" placeholder="例如：下週送週報過去">
          </div>
          <button type="submit" class="btn-primary">儲存本次紀錄</button>
        </form>
      </div>

      <h3>🕒 歷史跟進時間軸</h3>
      <div id="timeline-container" class="timeline">
        </div>
    </section>
    
    
    <section id="page-add-visitor" class="page-view hidden">
      <div class="page-header">
        <button class="btn-secondary" onclick="switchPage('list')">← 返回總表</button>
        <h2>＋ 新增拜訪對象</h2>
      </div>
      <div class="log-form-box">
        <form id="add-visitor-form" onsubmit="handleNewVisitor(event)">
          <div class="form-group">
            <label>姓名：</label>
            <input type="text" id="visitor-name" placeholder="請輸入對象姓名" required>
          </div>
          <div class="form-group">
            <label>性別：</label>
            <select id="visitor-gender">
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="form-group">
            <label>區域：</label>
            <input type="text" id="visitor-area" placeholder="例如：二林鎮、彰化市" required>
          </div>
          <div class="form-group">
            <label>地址：</label>
            <input type="text" id="visitor-address" placeholder="請輸入完整地址">
          </div>
          <div class="form-group">
            <label>目前的接觸狀態：</label>
            <select id="visitor-status">
              <option value="新接觸">新接觸</option>
              <option value="持續追蹤">持續追蹤</option>
            </select>
          </div>
          <button type="submit" class="btn-success">確認新增對象</button>
        </form>
      </div>
    </section>

    <section id="page-settings" class="page-view hidden">
      <div class="page-header">
        <h2>⚙️ 系統設定</h2>
      </div>
      <div class="settings-box">
        <div class="form-group">
          <label><strong>1. 請輸入您的使用者代號 (Owner)：</strong></label>
          <input type="text" id="settings-owner" placeholder="例如：User_A" onchange="saveSettings()">
          <small>※ 系統將會自動篩選並只顯示屬於您的拜訪對象。</small>
        </div>
        <div class="form-group">
          <label><strong>2. Google Apps Script URL：</strong></label>
          <input type="text" id="settings-gas-url" placeholder="https://script.google.com/..." onchange="saveSettings()">
          <small>※ 請貼上您剛剛部署完獲得的 Web App 網址。</small>
        </div>
        <p class="status-msg" id="settings-status"></p>
      </div>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
